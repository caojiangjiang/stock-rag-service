<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock RAG - 投资工作台</title>
    <link rel="stylesheet" href="css/app.css?v=5">
    <link rel="stylesheet" href="css/home.css?v=1">
</head>
<body>
    <div class="home-page">
        <header class="home-header">
            <div class="home-brand">
                <h1>Stock RAG</h1>
                <p>投资研究工作台</p>
            </div>
            <div class="home-user">
                <div class="user-avatar" id="user-avatar">U</div>
                <span id="username-display"></span>
                <button type="button" class="btn btn-ghost" id="logout-btn">退出</button>
            </div>
        </header>

        <main class="home-main">
            <section class="home-hero">
                <h2>选择功能模块</h2>
                <p>主题观察、持仓管理、角色分析与智能对话，一站入口</p>
            </section>

            <div class="module-grid">
                <a href="chat.html" class="module-card primary">
                    <div class="module-icon">💬</div>
                    <h3>智能对话</h3>
                    <p>基于 RAG 的股票问答，支持流式输出与多轮会话</p>
                    <span class="module-tag">核心功能</span>
                </a>
                <a href="themes.html" class="module-card">
                    <div class="module-icon">🔥</div>
                    <h3>主题快照</h3>
                    <p>AI、半导体、医药等赛道热度、强弱与领涨股一览</p>
                    <span class="module-tag">赛道观察</span>
                </a>
                <a href="portfolio.html" class="module-card">
                    <div class="module-icon">💼</div>
                    <h3>我的持仓</h3>
                    <p>股票与基金持仓管理，支持从 App 快捷导入</p>
                    <span class="module-tag">个人资产</span>
                </a>
                <a href="personas.html" class="module-card">
                    <div class="module-icon">👥</div>
                    <h3>投资角色</h3>
                    <p>成长、价值、动量等不同风格专家视角</p>
                    <span class="module-tag">多角色</span>
                </a>
                <a href="persona-daily-picks.html" class="module-card">
                    <div class="module-icon">📊</div>
                    <h3>选股推荐</h3>
                    <p>按投资风格生成的每日观察名单</p>
                    <span class="module-tag">每日更新</span>
                </a>
            </div>

            <p class="home-footer">风险提示：数据仅供研究参考，不构成投资建议</p>
        </main>
    </div>

    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const ok = await Auth.ensureAuthenticated({ redirect: true });
            if (!ok) return;
            const user = Auth.getUser();
            if (user) {
                document.getElementById('username-display').textContent = user.username || user.email || '';
                const initial = (user.username || user.email || 'U').charAt(0).toUpperCase();
                document.getElementById('user-avatar').textContent = initial;
            }
            document.getElementById('logout-btn').addEventListener('click', () => Auth.logout());
        });
    </script>
</body>
</html>
